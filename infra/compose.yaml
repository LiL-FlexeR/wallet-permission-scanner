name: wallet-permission-scanner

services:
  api:
    image: wallet-permission-scanner-api:0.1.0-local
    build:
      context: ..
      dockerfile: infra/docker/development.Dockerfile
      target: api
    init: true
    environment:
      NODE_ENV: production
      PORT: '3001'
      SCAN_MODE: ${SCAN_MODE:-demo}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s

  web:
    image: wallet-permission-scanner-web:0.1.0-local
    build:
      context: ..
      dockerfile: infra/docker/development.Dockerfile
      target: web
    init: true
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 10s
