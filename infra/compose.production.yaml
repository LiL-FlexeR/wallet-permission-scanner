name: wallet-permission-scanner-release

services:
  api:
    image: ${API_IMAGE:-wallet-permission-scanner-api:stage06-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      PORT: '3001'
      SCAN_MODE: ${SCAN_MODE:?Select live or demo explicitly}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the exact web origin}
      TRUSTED_PROXY_CIDRS: ''
      LOG_LEVEL: info
    expose: ['3001']
    deploy:
      replicas: 1
    stop_grace_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  web:
    image: ${WEB_IMAGE:-wallet-permission-scanner-web:stage06-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
